# kmscon configuration — a modern KMS/DRM console (TrueType fonts, more color).
# Installed to /etc/kmscon/kmscon.conf by lib/kmscon.sh.

# Render TTF fonts via pango.
font-engine=pango
# Change to a Nerd Font (e.g. "FiraCode Nerd Font Mono") if you installed one,
# or keep "monospace" for whatever TTF monospace the system has.
font-name=monospace
font-size=14

# Built-in palette closest to a warm dark theme. kmscon's custom-RGB palette
# support varies by version; base16-dark is a safe, good-looking default.
# Other options: default, solarized, solarized-black, soft-black, base16-light.
palette=base16-dark

# Keyboard layout — change if you don't use a US layout.
xkb-layout=us
