# Gruvbox-flavored starship prompt.
# Uses only the 16 ANSI color names so it degrades cleanly on the bare console.

add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[username]
show_always = true
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold blue"
format = "[@$hostname]($style) "

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"

[cmd_duration]
min_time = 500
style = "bold yellow"
format = " [$duration]($style)"
