# tty-beautify minimal tmux config — tuned for the TTY / console experience.
# Installed to the user's ~/.tmux.conf (the original is backed up first).

set -g mouse on                 # mouse: select/copy, wheel scroll, click to switch pane/window
set -g history-limit 50000      # bigger scrollback buffer (the console's own is tiny)
set -sg escape-time 0           # drop the ESC delay, so vim/nvim feel responsive
set -g base-index 1             # number windows from 1
setw -g pane-base-index 1
set -g renumber-windows on      # renumber windows after one is closed
setw -g mode-keys vi            # vi keys in copy mode

# The bare kernel console has only 16 colors; tmux-256color gives full color
# only inside a real terminal / fbterm.
set -g default-terminal "tmux-256color"

# 16-color-safe status bar (avoids color breakage on the bare console).
set -g status-style "bg=black,fg=green"
set -g status-left  "#[fg=yellow,bold] #S "
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=white]%H:%M "
set -g status-right-length 40

# More intuitive splits: | vertical, - horizontal (the default % and " still work).
bind | split-window -h
bind - split-window -v

# r reloads this config.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
